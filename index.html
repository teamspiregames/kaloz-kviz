<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kalóz Kvíz</title>
<style>
:root { --khaki: khaki; --red: #8A0303; --blue: #3A5F7D; --green: #1b8d43; }
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
  font-family: Arial, Helvetica, sans-serif; color: #17202a;
  background: #152c3a url("bg.jpg") center/cover fixed no-repeat;
}
.card {
  width: min(900px, 100%); padding: clamp(22px, 5vw, 48px); border-radius: 22px;
  background: rgba(255,255,255,.88); box-shadow: 0 14px 45px rgba(0,0,0,.28);
  text-align: center; backdrop-filter: blur(3px);
}
.hidden { display: none !important; }
.logo { width: min(220px, 55vw); max-height: 180px; object-fit: contain; margin: 0 auto 12px; }
h1 { margin: 8px 0 22px; font-size: clamp(2rem, 5vw, 3.3rem); }
#questionCounter { font-weight: 800; font-size: 1.05rem; color: #5309a6; margin-bottom: 14px; }
#timer { font-weight: 800; font-size: 1.25rem; color: #b00000; margin-bottom: 18px; }
#question { font-size: clamp(1.2rem, 3vw, 1.65rem); line-height: 1.35; font-weight: 700; margin: 0 auto 26px; max-width: 760px; }
.answers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin: 0 0 24px; }
.answer {
  min-height: 95px; padding: 18px 12px; border-radius: 16px; display: grid; place-items: center;
  font-size: 1.05rem; font-weight: 700; overflow-wrap: anywhere;
}
.answer:nth-child(1) { background: var(--khaki); color: #111; }
.answer:nth-child(2) { background: var(--red); color: white; }
.answer:nth-child(3) { background: var(--blue); color: white; }
.answer.correct { outline: 4px solid var(--green); outline-offset: -4px; }
.answer.wrong { background: #e0e0e0 !important; color: #111 !important; }
button {
  border: 0; border-radius: 999px; padding: 14px 28px; font-size: 1rem; font-weight: 800;
  cursor: pointer; color: white; background: #172f43; box-shadow: 0 5px 12px rgba(0,0,0,.15);
}
button:hover { filter: brightness(1.12); }
button:focus-visible { outline: 3px solid #f0a500; outline-offset: 3px; }
#message { font-weight: 800; color: #b00000; min-height: 24px; margin: 0 0 14px; }
#result h2 { font-size: 2rem; }
@media (max-width: 650px) {
  body { padding: 12px; }
  .answers { grid-template-columns: 1fr; gap: 10px; }
  .answer { min-height: 65px; }
  .card { padding: 24px 18px; }
}
</style>
</head>
<body>
<main class="card">
  <section id="startScreen">
    <img class="logo" src="logo.png" alt="Kalóz Kvíz logó" onerror="this.style.display='none'">
    <h1>Kalóz Kvíz</h1>
    <p>25 véletlenszerű kérdés az 50-ből. Kérdésenként 2 perc áll rendelkezésedre.</p>
    <button id="startBtn">KEZDÉS</button>
  </section>

  <section id="quizScreen" class="hidden">
    <div id="questionCounter">1 / 25. kérdés</div>
    <div id="timer">02:00</div>
    <div id="question"></div>
    <div class="answers" id="answers"></div>
    <div id="message" aria-live="polite"></div>
    <button id="revealBtn">Mutasd a helyes választ</button>
    <button id="nextBtn" class="hidden">Következő kérdés</button>
  </section>

  <section id="result" class="hidden">
    <h2>Véget ért a kvíz!</h2>
    <p id="resultText"></p>
    <button id="restartBtn">Új játék</button>
  </section>
</main>

<script>
const questions = [
 {q:"Melyik ország fővárosa Ljubljana?", options:["Szlovénia","Szlovákia","Horvátország"], answer:"Szlovénia"},
 {q:"Ki írta a Bűn és bűnhődést?", options:["Lev Tolsztoj","Fjodor Dosztojevszkij","Anton Csehov"], answer:"Fjodor Dosztojevszkij"},
 {q:"Melyik elem vegyjele a W?", options:["Wolfram","Vanádium","Volfrámium"], answer:"Wolfram"},
 {q:"Melyik bolygón található a Valles Marineris?", options:["Mars","Vénusz","Merkúr"], answer:"Mars"},
 {q:"Ki festette a Guernicát?", options:["Salvador Dalí","Pablo Picasso","Joan Miró"], answer:"Pablo Picasso"},
 {q:"Melyik tenger választja el Európát Afrikától?", options:["Földközi-tenger","Balti-tenger","Északi-tenger"], answer:"Földközi-tenger"},
 {q:"Mi a fotoszintézis során felszabaduló gáz?", options:["Oxigén","Nitrogén","Hidrogén"], answer:"Oxigén"},
 {q:"Melyik évben ért véget a második világháború Európában?", options:["1944","1945","1946"], answer:"1945"},
 {q:"Ki komponálta A varázsfuvolát?", options:["Mozart","Beethoven","Haydn"], answer:"Mozart"},
 {q:"Melyik a világ legnagyobb óceánja?", options:["Atlanti-óceán","Csendes-óceán","Indiai-óceán"], answer:"Csendes-óceán"},
 {q:"Melyik városban található az Uffizi képtár?", options:["Róma","Firenze","Milánó"], answer:"Firenze"},
 {q:"Hány szívkamrája van az emberi szívnek?", options:["Kettő","Három","Négy"], answer:"Négy"},
 {q:"Melyik ország pénzneme a zloty?", options:["Lengyelország","Csehország","Románia"], answer:"Lengyelország"},
 {q:"Ki volt az első ember a Holdon?", options:["Buzz Aldrin","Neil Armstrong","Michael Collins"], answer:"Neil Armstrong"},
 {q:"Melyik Shakespeare-dráma főszereplője Othello?", options:["Lear király","Othello","Hamlet"], answer:"Othello"},
 {q:"Mi a legkeményebb természetes ásvány?", options:["Korund","Gyémánt","Kvarc"], answer:"Gyémánt"},
 {q:"Melyik folyó folyik át Budapesten?", options:["Tisza","Duna","Dráva"], answer:"Duna"},
 {q:"Melyik országban található Machu Picchu?", options:["Peru","Bolívia","Chile"], answer:"Peru"},
 {q:"Melyik tudós nevéhez kötődik a relativitáselmélet?", options:["Isaac Newton","Albert Einstein","Niels Bohr"], answer:"Albert Einstein"},
 {q:"Melyik sportágban használják a „love” kifejezést nulla pontra?", options:["Tenisz","Golf","Rögbi"], answer:"Tenisz"},
 {q:"Melyik a periódusos rendszer első eleme?", options:["Hélium","Hidrogén","Lítium"], answer:"Hidrogén"},
 {q:"Ki írta az Isteni színjátékot?", options:["Dante Alighieri","Petrarca","Boccaccio"], answer:"Dante Alighieri"},
 {q:"Melyik ország zászlaján szerepel juharlevél?", options:["Kanada","Ausztrália","Új-Zéland"], answer:"Kanada"},
 {q:"Melyik állat emlős, mégis tojást rak?", options:["Koala","Kacsacsőrű emlős","Delfin"], answer:"Kacsacsőrű emlős"},
 {q:"Melyik város az Európai Unió több intézményének székhelye?", options:["Strasbourg","Brüsszel","Luxembourg"], answer:"Brüsszel"},
 {q:"Melyik magyar Nobel-díjas kutató fejlesztette ki a C-vitamin izolálásának módszerét?", options:["Szent-Györgyi Albert","Békésy György","Gábor Dénes"], answer:"Szent-Györgyi Albert"},
 {q:"Melyik országban található Petra ókori városa?", options:["Jordánia","Egyiptom","Libanon"], answer:"Jordánia"},
 {q:"Mi a mértékegysége az elektromos ellenállásnak?", options:["Volt","Ohm","Watt"], answer:"Ohm"},
 {q:"Melyik regényben szerepel Atticus Finch?", options:["Ne bántsátok a feketerigót!","A nagy Gatsby","Az öreg halász és a tenger"], answer:"Ne bántsátok a feketerigót!"},
 {q:"Melyik ország területén található a Kilimandzsáró?", options:["Kenya","Tanzánia","Uganda"], answer:"Tanzánia"},
 {q:"Melyik festészeti irányzat képviselője Claude Monet?", options:["Impresszionizmus","Kubizmus","Barokk"], answer:"Impresszionizmus"},
 {q:"Mi a Föld légkörének legnagyobb arányú alkotóeleme?", options:["Oxigén","Nitrogén","Argon"], answer:"Nitrogén"},
 {q:"Melyik évben kezdődött a francia forradalom?", options:["1789","1776","1815"], answer:"1789"},
 {q:"Ki rendezte a Pulp Fiction című filmet?", options:["Martin Scorsese","Quentin Tarantino","Francis Ford Coppola"], answer:"Quentin Tarantino"},
 {q:"Melyik a legkisebb prímszám?", options:["0","1","2"], answer:"2"},
 {q:"Melyik országban található a Transzszibériai vasút végállomásaként ismert Vlagyivosztok?", options:["Oroszország","Mongólia","Kazahsztán"], answer:"Oroszország"},
 {q:"Melyik görög isten a tenger ura?", options:["Zeusz","Poszeidón","Hádész"], answer:"Poszeidón"},
 {q:"Melyik hangszercsaládba tartozik a fagott?", options:["Rézfúvós","Vonós","Fafúvós"], answer:"Fafúvós"},
 {q:"Melyik országban született Frida Kahlo?", options:["Mexikó","Spanyolország","Argentína"], answer:"Mexikó"},
 {q:"Milyen mértékegységben mérjük a frekvenciát?", options:["Hertz","Pascal","Joule"], answer:"Hertz"},
 {q:"Melyik város híres operaháza a La Scala?", options:["Velence","Milánó","Nápoly"], answer:"Milánó"},
 {q:"Melyik kontinensen található a Szahara?", options:["Ázsia","Afrika","Dél-Amerika"], answer:"Afrika"},
 {q:"Ki volt az ókori görög filozófus, Platón tanítója?", options:["Arisztotelész","Szókratész","Epikurosz"], answer:"Szókratész"},
 {q:"Melyik vércsoport tekinthető vörösvérsejt-transzfúziónál univerzális donornek (Rh-negatív rendszerben)?", options:["AB−","0−","A−"], answer:"0−"},
 {q:"Melyik országban található a Salar de Uyuni sómező?", options:["Bolívia","Peru","Ecuador"], answer:"Bolívia"},
 {q:"Melyik zenekar adta ki a The Dark Side of the Moon albumot?", options:["The Beatles","Pink Floyd","Led Zeppelin"], answer:"Pink Floyd"},
 {q:"Mi a matematika neve annak a számnak, amelynek négyzete −1?", options:["i, imaginárius egység","π","e"], answer:"i, imaginárius egység"},
 {q:"Melyik ókori civilizáció használta a hieroglif írást?", options:["Egyiptomi","Föníciai","Mükénéi"], answer:"Egyiptomi"},
 {q:"Melyik ország fővárosa Reykjavík?", options:["Norvégia","Izland","Dánia"], answer:"Izland"},
 {q:"Melyik szerv termeli az inzulint?", options:["Máj","Hasnyálmirigy","Pajzsmirigy"], answer:"Hasnyálmirigy"},
 {q:"Melyik mű a Don Quijote szerzőjétől származik?", options:["Miguel de Cervantes","Lope de Vega","Federico García Lorca"], answer:"Miguel de Cervantes"}
];

const startScreen = document.getElementById("startScreen");
const quizScreen = document.getElementById("quizScreen");
const resultScreen = document.getElementById("result");
const questionCounter = document.getElementById("questionCounter");
const timerEl = document.getElementById("timer");
const questionEl = document.getElementById("question");
const answersEl = document.getElementById("answers");
const messageEl = document.getElementById("message");
const revealBtn = document.getElementById("revealBtn");
const nextBtn = document.getElementById("nextBtn");
let selectedQuestions = [], currentIndex = 0, secondsLeft = 120, timer = null, revealed = false;

function shuffle(array) {
  const a = [...array];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function startQuiz() {
  clearInterval(timer);
  selectedQuestions = shuffle(questions).slice(0, 25);
  currentIndex = 0;
  startScreen.classList.add("hidden");
  resultScreen.classList.add("hidden");
  quizScreen.classList.remove("hidden");
  showQuestion();
}
function showQuestion() {
  clearInterval(timer);
  if (currentIndex >= selectedQuestions.length) { showResult(); return; }
  revealed = false;
  secondsLeft = 120;
  const item = selectedQuestions[currentIndex];
  questionCounter.textContent = `${currentIndex + 1} / ${selectedQuestions.length}. kérdés`;
  questionEl.textContent = item.q;
  answersEl.innerHTML = "";
  shuffle(item.options).forEach(option => {
    const box = document.createElement("div");
    box.className = "answer";
    box.textContent = option;
    box.dataset.option = option;
    answersEl.appendChild(box);
  });
  messageEl.textContent = "";
  timerEl.style.color = "#b00000";
  revealBtn.classList.remove("hidden");
  nextBtn.classList.add("hidden");
  updateTimer();
  timer = setInterval(() => {
    secondsLeft--;
    updateTimer();
    if (secondsLeft <= 0) {
      clearInterval(timer);
      if (!revealed) messageEl.textContent = "LEJÁRT AZ IDŐ, KÉREM A VÁLASZOKAT!";
    }
  }, 1000);
}
function updateTimer() {
  const m = String(Math.floor(secondsLeft / 60)).padStart(2, "0");
  const s = String(secondsLeft % 60).padStart(2, "0");
  timerEl.textContent = `${m}:${s}`;
}
function revealAnswer() {
  if (revealed) return;
  revealed = true;
  clearInterval(timer);
  timerEl.style.color = "white";
  messageEl.textContent = "";
  const correct = selectedQuestions[currentIndex].answer;
  [...answersEl.children].forEach(box => {
    if (box.dataset.option === correct) box.classList.add("correct");
    else box.classList.add("wrong");
  });
  revealBtn.classList.add("hidden");
  nextBtn.classList.remove("hidden");
  nextBtn.textContent = currentIndex === selectedQuestions.length - 1 ? "Eredmény" : "Következő kérdés";
}
function nextQuestion() {
  currentIndex++;
  showQuestion();
}
function showResult() {
  clearInterval(timer);
  quizScreen.classList.add("hidden");
  resultScreen.classList.remove("hidden");
  document.getElementById("resultText").textContent = `A kvíz 25 kérdésből állt. Köszönjük a játékot!`;
}
document.getElementById("startBtn").addEventListener("click", startQuiz);
document.getElementById("restartBtn").addEventListener("click", () => {
  resultScreen.classList.add("hidden");
  startScreen.classList.remove("hidden");
});
revealBtn.addEventListener("click", revealAnswer);
nextBtn.addEventListener("click", nextQuestion);
</script>
</body>
</html>
